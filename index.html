<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Futur en Commun</title>

  <meta name="description" content="Futur en Commun est une application éco-citoyenne locale pour signaler, soutenir et participer à des actions concrètes près de chez soi." />

  <link rel="canonical" href="https://futurencommun.fr/" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    :root{
      --bg:#FEF8F5;
      --green:#9DB35C;
      --green-dark:#556F25;
      --green-soft:#EEF5DE;
      --text:#2D2D2D;
      --muted:#7C7C7C;
      --radius-xl:36px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter', sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .page{
      max-width:1280px;
      margin:auto;
      padding:28px;
      min-height:100vh;
      display:flex;
      align-items:center;
    }

    .hero-shell{
      position:relative;
      overflow:hidden;
      width:100%;
      background:#FEF8F5;
      border-radius:36px;
      padding:48px;
    }

    /* BANDE VERTE */

    .hero-shell::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      width:170px;
      height:100%;
      background:#556F25;
      z-index:0;
    }

    .hero{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:1fr 1fr;
      align-items:center;
      gap:40px;
    }

    /* LOGO CERCLE */

    .left-visual{
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .circle-logo{
      width:300px;
      height:300px;
      border-radius:50%;
      background:#AFC66A;
      border:4px solid rgba(255,255,255,0.75);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.05);
    }

    .circle-logo img{
      width:72%;
      object-fit:contain;
    }

    /* CONTENU */

    .content{
      max-width:560px;
    }

    .eyebrow{
      display:inline-block;
      background:#EEF5DE;
      color:#556F25;
      padding:10px 18px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      letter-spacing:0.08em;
      text-transform:uppercase;
      margin-bottom:24px;
    }

    h1{
      font-size:72px;
      line-height:0.95;
      letter-spacing:-0.06em;
      margin-bottom:26px;
      font-weight:700;
    }

    .subtitle{
      font-size:20px;
      line-height:1.7;
      color:#707070;
      margin-bottom:32px;
      max-width:520px;
    }

    .cta-row{
      display:flex;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
      margin-bottom:36px;
    }

    .btn{
      background:#9DB35C;
      color:white;
      text-decoration:none;
      padding:16px 26px;
      border-radius:14px;
      font-weight:600;
      transition:0.2s ease;
    }

    .btn:hover{
      opacity:0.92;
    }

    .micro-note{
      color:#7E8478;
      font-size:15px;
    }

    /* MOCKUP */

    .phone-wrap{
      display:flex;
      justify-content:center;
      position:relative;
    }

    .phone{
      width:310px;
      background:white;
      border:5px solid #2E421B;
      border-radius:42px;
      padding:14px;
      position:relative;
      box-shadow:0 10px 24px rgba(0,0,0,0.08);
    }

    .phone::before{
      content:"";
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      width:120px;
      height:28px;
      background:#2E421B;
      border-radius:999px;
      z-index:3;
    }

    .screen{
      overflow:hidden;
      border-radius:30px;
    }

    .screen img{
      width:100%;
      display:block;
    }

    /* SLOGAN */

    .signature{
      margin-top:38px;
    }

    .signature img{
      width:420px;
      max-width:100%;
    }

    /* RESPONSIVE */

    @media (max-width:980px){

      .hero{
        grid-template-columns:1fr;
      }

      .hero-shell::before{
        width:100%;
        height:160px;
      }

      .left-visual{
        justify-content:flex-start;
      }

      h1{
        font-size:54px;
      }

    }

    @media (max-width:640px){

      .page{
        padding:16px;
      }

      .hero-shell{
        padding:28px;
      }

      h1{
        font-size:42px;
      }

      .subtitle{
        font-size:17px;
      }

      .circle-logo{
        width:220px;
        height:220px;
      }

      .phone{
        width:260px;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <section class="hero-shell">

      <div class="hero">

        <!-- GAUCHE -->

        <div class="left-visual">

          <div class="circle-logo">
            <img src="./logo.png" alt="Futur en Commun">
          </div>

        </div>

        <!-- DROITE -->

        <div class="content">

          <div class="eyebrow">
            🌱 Impact local et concret
          </div>

          <h1>
            Transformer les besoins locaux en actions concrètes.
          </h1>

          <p class="subtitle">
            Une application locale pour signaler, soutenir et participer à des actions utiles près de chez soi.
          </p>

          <div class="cta-row">

            <a class="btn"
               href="https://futurencommun.glide.page"
               target="_blank"
               rel="noopener noreferrer">

              Accéder à l’application

            </a>

            <span class="micro-note">
              Simple • Local • Concret
            </span>

          </div>

          <!-- SLOGAN IMAGE -->

          <div class="signature">
            <img src="./slogan.png" alt="Un engagement simple, local et responsable">
          </div>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
