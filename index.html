<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Futur en Commun</title>

  <meta name="description"
        content="Futur en Commun est une application éco-citoyenne locale pour signaler, soutenir et participer à des actions concrètes près de chez soi."/>

  <link rel="canonical" href="https://futurencommun.fr/" />

  <!-- POLICE -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    :root{
      --bg:#FEF8F5;
      --green:#9DB35C;
      --green-dark:#556F25;
      --green-soft:#EEF5DE;
      --text:#2D2D2D;
      --muted:#767676;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Plus Jakarta Sans', sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .page{
      max-width:1280px;
      margin:auto;
      min-height:100vh;
      padding:28px;
      display:flex;
      align-items:center;
    }

    .hero-shell{
      width:100%;
      background:#FEF8F5;
      border-radius:36px;
      overflow:hidden;
      position:relative;
      padding:54px;
    }

    /* BANDE VERTE */

    .hero-shell::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      width:140px;
      height:100%;
      background:#556F25;
      z-index:0;
    }

    .hero{
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:1fr 1fr;
      align-items:center;
      gap:48px;
    }

    /* PARTIE GAUCHE */

    .left-side{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .circle-logo{
      width:270px;
      height:270px;
      border-radius:50%;
      background:#AFC66A;
      border:4px solid rgba(255,255,255,0.7);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      box-shadow:0 10px 24px rgba(0,0,0,0.04);
    }

    .circle-logo img{
      width:82%;
      object-fit:contain;
      background:transparent;
    }

    /* CONTENU */

    .content{
      max-width:580px;
    }

    .eyebrow{
      display:inline-block;
      background:#EEF5DE;
      color:#556F25;
      padding:11px 18px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
      letter-spacing:0.08em;
      text-transform:uppercase;
      margin-bottom:24px;
    }

    h1{
      font-size:78px;
      line-height:0.92;
      letter-spacing:-0.07em;
      font-weight:800;
      margin-bottom:28px;
    }

    .subtitle{
      font-size:21px;
      line-height:1.7;
      color:var(--muted);
      margin-bottom:34px;
      max-width:540px;
    }

    /* CTA */

    .cta-row{
      display:flex;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
      margin-bottom:42px;
    }

    .btn{
      background:#9DB35C;
      color:white;
      text-decoration:none;
      padding:16px 26px;
      border-radius:14px;
      font-size:17px;
      font-weight:600;
      transition:0.2s ease;
    }

    .btn:hover{
      opacity:0.92;
    }

    .micro-note{
      color:#7C7C7C;
      font-size:15px;
    }

    /* SLOGAN */

    .signature img{
      width:430px;
      max-width:100%;
      opacity:0.95;
    }

    /* RESPONSIVE */

    @media (max-width:980px){

      .hero{
        grid-template-columns:1fr;
      }

      .hero-shell::before{
        width:100%;
        height:160px;
      }

      h1{
        font-size:56px;
      }

      .left-side{
        justify-content:flex-start;
      }

    }

    @media (max-width:640px){

      .page{
        padding:16px;
      }

      .hero-shell{
        padding:28px;
      }

      h1{
        font-size:42px;
      }

      .subtitle{
        font-size:18px;
      }

      .circle-logo{
        width:220px;
        height:220px;
      }

    }

  </style>
</head>

<body>

  <main class="page">

    <section class="hero-shell">

      <div class="hero">

        <!-- GAUCHE -->

        <div class="left-side">

          <div class="circle-logo">
            <img src="./logo.png" alt="Futur en Commun">
          </div>

        </div>

        <!-- DROITE -->

        <div class="content">

          <div class="eyebrow">
            🌱 Impact local et concret
          </div>

          <h1>
            Transformer les besoins locaux en actions concrètes.
          </h1>

          <p class="subtitle">
            Une application locale pour signaler, soutenir et participer à des actions utiles près de chez soi.
          </p>

          <div class="cta-row">

            <a class="btn"
               href="https://futurencommun.glide.page"
               target="_blank">

              Accéder à l’application

            </a>

            <span class="micro-note">
              Simple • Local • Concret
            </span>

          </div>

          <!-- SLOGAN -->

          <div class="signature">
            <img src="./Slogan.png"
                 alt="Un engagement simple, local et responsable">
          </div>

        </div>

      </div>

    </section>

  </main>

</body>

</html>
